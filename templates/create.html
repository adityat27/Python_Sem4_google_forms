<!DOCTYPE html>
<html lang="en">
<head>
    <title>Classlytics | Create</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-slate-50 p-8 max-w-3xl mx-auto">
    <h1 class="text-3xl font-extrabold text-blue-700 mb-6">Create AI Quiz</h1>
    
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
        <textarea id="sourceText" class="w-full p-4 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" rows="5" placeholder="Paste textbook or PDF text here..."></textarea>
        <button onclick="generateAIQuiz()" id="aiBtn" class="mt-4 bg-blue-600 text-white font-bold px-6 py-2 rounded-lg w-full">Generate Questions</button>
        <p id="loadingText" class="hidden text-blue-600 font-bold mt-2 text-center animate-pulse">Generating...</p>
    </div>

    <div id="editableQuizContainer" class="space-y-4"></div>
    <button onclick="publishQuiz()" id="publishBtn" class="hidden mt-6 bg-green-600 text-white font-bold px-6 py-3 rounded-lg w-full">Save & Publish to Students</button>

    <script>
        let generatedData = [];

        async function generateAIQuiz() {
            const text = document.getElementById('sourceText').value;
            if(!text) return;
            document.getElementById('aiBtn').classList.add('hidden');
            document.getElementById('loadingText').classList.remove('hidden');

            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            generatedData = await res.json();
            
            let html = "";
            generatedData.forEach((q, i) => {
                html += `
                <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                    <label class="text-xs font-bold text-slate-500">QUESTION ${i+1}</label>
                    <input type="text" id="q${i}" value="${q.question}" class="w-full font-semibold mb-2 p-2 border-b outline-none">
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <input type="text" id="q${i}_a" value="${q.option_a}" class="p-2 border rounded">
                        <input type="text" id="q${i}_b" value="${q.option_b}" class="p-2 border rounded">
                        <input type="text" id="q${i}_c" value="${q.option_c}" class="p-2 border rounded">
                        <input type="text" id="q${i}_d" value="${q.option_d}" class="p-2 border rounded">
                    </div>
                    <label class="text-xs font-bold text-slate-500 mt-2 block">CORRECT OPTION (a, b, c, d)</label>
                    <input type="text" id="q${i}_ans" value="${q.correct_option}" class="p-2 border rounded w-16 text-center font-bold">
                </div>`;
            });
            document.getElementById('editableQuizContainer').innerHTML = html;
            document.getElementById('loadingText').classList.add('hidden');
            document.getElementById('publishBtn').classList.remove('hidden');
        }

        function publishQuiz() {
            // Save edits
            generatedData.forEach((q, i) => {
                q.question = document.getElementById(`q${i}`).value;
                q.option_a = document.getElementById(`q${i}_a`).value;
                q.option_b = document.getElementById(`q${i}_b`).value;
                q.option_c = document.getElementById(`q${i}_c`).value;
                q.option_d = document.getElementById(`q${i}_d`).value;
                q.correct_option = document.getElementById(`q${i}_ans`).value;
            });
            localStorage.setItem('active_quiz', JSON.stringify(generatedData));
            window.location.href = '/quiz';
        }
    </script>
</body>
</html>
