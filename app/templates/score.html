<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <title>Classlytics | Score</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#18181b] min-h-screen flex items-center justify-center p-4">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <div class="backdrop-blur-xl bg-[#27272a]/80 border border-white/10 p-10 rounded-3xl shadow-2xl max-w-md w-full text-center relative overflow-hidden">
        <div class="absolute -top-20 -left-20 w-40 h-40 bg-blue-500 rounded-full mix-blend-screen filter blur-[80px] opacity-50"></div>
        
        <h1 class="text-3xl font-extrabold text-gray-100 mb-8 tracking-tight">Assessment Complete</h1>
        
        <div class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 mb-10" id="scoreDisplay">--</div>
        
        <div class="bg-black/30 p-6 rounded-2xl flex justify-between text-gray-400 border border-white/5 mb-8">
            <div class="text-center">
                <p class="text-xs font-bold tracking-widest uppercase mb-1">Time</p>
                <p id="timeDisplay" class="text-2xl text-gray-100 font-semibold">--s</p>
            </div>
            <div class="w-px bg-white/10"></div>
            <div class="text-center">
                <p class="text-xs font-bold tracking-widest uppercase mb-1 text-red-400/80">Tab Switches</p>
                <p id="tabDisplay" class="text-2xl text-red-400 font-semibold">--</p>
            </div>
        </div>

        <a href="/dashboard" class="inline-block bg-white/10 hover:bg-white/20 text-white font-bold py-3 px-6 rounded-xl transition-colors w-full border border-white/5">
            Return to Dashboard
        </a>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('final_score'));
        if(data) {
            document.getElementById('scoreDisplay').innerText = data.attention_score;
            document.getElementById('timeDisplay').innerText = data.time_taken + 's';
            document.getElementById('tabDisplay').innerText = data.switches;
            
            if (data.attention_score >= 85) {
                var duration = 3 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    var particleCount = 50 * (timeLeft / duration);
                    confetti({ ...defaults, particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } });
                }, 250);
            }
        }
    </script>
    
</body>
</html>
