<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <title>Classlytics | Attempt Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#18181b] text-gray-100 font-sans min-h-screen p-8">
    <div class="max-w-3xl mx-auto">
        
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 p-4 rounded-xl mb-8 font-bold flex items-center gap-3 shadow-lg">
            <span class="text-xl">⚠️</span> Focus Tracking Active. Tab switches will heavily deduct points!
        </div>
        
        <div id="setupArea" class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-10 text-center shadow-2xl">
            <h2 class="text-2xl font-bold mb-4">Proctoring Required</h2>
            <p class="text-gray-400 mb-8">You must share your screen to begin the assessment.</p>
            <button onclick="startProctoring()" id="startBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-8 rounded-xl transition-transform hover:scale-105 shadow-lg shadow-red-500/20">
                Share Screen & Begin
            </button>
        </div>

        <div id="quizContent" class="hidden">
            <div id="timerDisplay" class="fixed top-6 right-10 bg-black/40 backdrop-blur-md border border-white/10 px-6 py-3 rounded-2xl text-2xl font-bold text-white shadow-2xl hidden transition-colors duration-500">
            ⏱️ <span id="timeRemaining">--:--</span>
        </div>
            <h1 class="text-3xl font-bold text-blue-400 mb-8">{{ quiz_title }}</h1>
            <div id="quizArea" class="space-y-6"></div>
            <button onclick="submitAssessment()" class="mt-8 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl w-full transition-transform hover:scale-[0.99] shadow-xl">
                Submit Final Answers
            </button>
        </div>
    </div>

    <script id="quiz-data" type="application/json">
        {{ quiz_data | safe }}
    </script>

    <div id="cheatToast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-full font-bold shadow-2xl transition-all duration-300 translate-y-[-150%] opacity-0 z-50">
    🚨 Focus Lost! Tab switch recorded.
</div>

    <script>
        let tabSwitches = 0;
        let startTime = null;
        let lastInteractionTime = null; 
        let questionTimes = {};
        let timeLimitSeconds = ({{ time_limit | default(5) | tojson }}) * 60;
        let timerInterval = null;
        let tabSwitchLogs = [];
        const quizData = JSON.parse(document.getElementById('quiz-data').textContent);
        
        let mediaRecorder;
        let videoBuffer = [];
        const uniqueVideoName = "student_" + Math.floor(Math.random() * 100000);

        async function startProctoring() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp8' });
                
               mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        videoBuffer.push(e.data); 
                        
                        if (videoBuffer.length > 10) {
                            videoBuffer.shift(); 
                        }
                    }
                };
             
                mediaRecorder.start(1000); 
                
                startTime = Date.now();
                document.getElementById('timerDisplay').classList.remove('hidden');
                timerInterval = setInterval(updateTimer, 1000);
                lastInteractionTime = Date.now();
                document.getElementById('setupArea').classList.add('hidden');
                document.getElementById('quizContent').classList.remove('hidden');
            } catch (err) {
                alert("You must share your screen to take the quiz!");
            }
        }

        document.addEventListener("visibilitychange", async () => {
            if (!startTime) return;
            
            if (document.hidden) {
                // They left the tab! Log the penalty.
                tabSwitches++;
                showToastWarning();
                
                let elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                let mins = Math.floor(elapsedSeconds / 60);
                let secs = elapsedSeconds % 60;
                let displayTime = `${mins}m ${secs.toString().padStart(2, '0')}s`;
                let clockTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                tabSwitchLogs.push({
                    video_time: elapsedSeconds,
                    display_time: displayTime,
                    clock_time: clockTime
                });
            } else {
                
                if (videoBuffer.length > 0) {
                    let blob = new Blob(videoBuffer, { type: 'video/webm' });
                    let formData = new FormData();
                    formData.append("video_chunk", blob);
                    
                    formData.append("filename", uniqueVideoName + "_incident_" + tabSwitches);
                    
                    await fetch('/api/upload_chunk', { method: 'POST', body: formData });
                    
                   
                    videoBuffer = []; 
                }
            }
        });

        let html = "";
        quizData.forEach((q, i) => {
            html += `
            <div class="backdrop-blur-md bg-[#27272a]/80 border border-white/5 rounded-2xl p-6 shadow-xl mb-6">
                <p class="font-bold text-xl mb-6">${i + 1}. ${q.question}</p>
                <select id="ans${i}" class="w-full bg-black/30 border border-white/10 p-4 rounded-xl text-gray-200 outline-none focus:border-blue-500">
                    <option value="none">-- Select your answer --</option>
                    <option value="a">A. ${q.option_a}</option>
                    <option value="b">B. ${q.option_b}</option>
                    <option value="c">C. ${q.option_c}</option>
                    <option value="d">D. ${q.option_d}</option>
                </select>
            </div>`;
        });
        document.getElementById('quizArea').innerHTML = html;

        // Attach event listeners to all answer selects
        quizData.forEach((q, i) => {
            const select = document.getElementById(`ans${i}`);
            select.addEventListener('change', () => {
                // Only record the time the FIRST time they pick an answer for this question
                if (!questionTimes[`Q${i+1}`]) { 
                    let timeSpent = Math.floor((Date.now() - lastInteractionTime) / 1000);
                    questionTimes[`Q${i+1}`] = timeSpent;
                    // Reset the timer for the next question they answer
                    lastInteractionTime = Date.now(); 
                }
            });
        });

        function updateTimer() {
            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            let remaining = timeLimitSeconds - elapsed;

            if (remaining <= 0) {
                // Time is up! Stop the clock and force submit
                clearInterval(timerInterval);
                document.getElementById('timeRemaining').innerText = "00:00";
                submitAssessment(true); // 'true' means it was forced
            } else {
                let m = Math.floor(remaining / 60);
                let s = remaining % 60;
                document.getElementById('timeRemaining').innerText = `${m}:${s.toString().padStart(2, '0')}`;
                
                // Turn red in the final 60 seconds
                if (remaining <= 60) {
                    document.getElementById('timerDisplay').classList.add('text-red-500', 'border-red-500/50');
                }
            }
        }

       async function submitAssessment(isAutoSubmit = false) {
            clearInterval(timerInterval); // Stop timer if they submit early
            
            document.querySelector('button[onclick="submitAssessment()"]').innerText = "Finalizing Score...";

            let timeTaken = Math.floor((Date.now() - startTime) / 1000);
            
            
            let accuracy = 0;
            let pts = 100 / quizData.length;
            let questionResults = {}; 

            quizData.forEach((q, i) => {
                let studentAnswer = document.getElementById(`ans${i}`).value;
                let isCorrect = (studentAnswer === q.correct_option);
                
                if (isCorrect) accuracy += pts;
                
                // Save true/false for this specific question
                questionResults[`Q${i+1}`] = isCorrect; 
            });
            // Removed the extra stray }; that was here

            // Stop recording
            mediaRecorder.stop();

            // Just send the score data, video was already uploaded in the background
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    switches: tabSwitches, 
                    time_taken: timeTaken, 
                    accuracy: accuracy,
                    video_filename: uniqueVideoName,
                    question_times: questionTimes,
                    auto_submitted: isAutoSubmit,
                    question_results: questionResults,
                    switch_logs: tabSwitchLogs
                })
            });
            
            const result = await res.json();
            localStorage.setItem('final_score', JSON.stringify(result));
            window.location.href = '/score';
        }

        function showToastWarning() {
    const toast = document.getElementById('cheatToast');
    toast.classList.remove('translate-y-[-150%]', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');
    
    setTimeout(() => {
        toast.classList.add('translate-y-[-150%]', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
    }, 3000);
}
    </script>
</body>
</html>
