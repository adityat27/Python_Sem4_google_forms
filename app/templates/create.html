<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <title>Classlytics | Create</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        /* Custom Scrollbar for Mac-like feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e20; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#18181b] text-gray-100 font-sans min-h-screen p-8 selection:bg-blue-500/30">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Create AI Quiz</h1>
            <a href="/dashboard" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">← Back to Dashboard</a>
        </div>

        <div class="backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-6 shadow-2xl mb-8 transition-all">
            <textarea id="sourceText" class="w-full bg-[#27272a]/50 text-gray-200 p-4 border border-white/5 rounded-xl outline-none focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/50 transition-all resize-none" rows="5" placeholder="Paste textbook or PDF text here..."></textarea>
            
            <button onclick="generateAIQuiz()" id="aiBtn" class="mt-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-6 py-3 rounded-xl w-full transition-all shadow-lg shadow-blue-500/20 active:scale-[0.98]">
                Generate Questions with AI
            </button>
            <p id="loadingText" class="hidden text-blue-400 font-medium mt-4 text-center animate-pulse">Analyzing text and generating questions...</p>
        </div>

        <div id="editableQuizContainer" class="space-y-6"></div>
        
        <button onclick="publishQuiz()" id="publishBtn" class="hidden mt-8 bg-white text-black hover:bg-gray-200 font-bold px-6 py-4 rounded-xl w-full transition-all shadow-xl active:scale-[0.98]">
            Save to Database
        </button>
    </div>

    <script>
        let generatedData = [];

        async function generateAIQuiz() {
            const text = document.getElementById('sourceText').value;
            if(!text) return;
            
            document.getElementById('aiBtn').classList.add('hidden');
            document.getElementById('loadingText').classList.remove('hidden');

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                
                generatedData = await res.json();
                
                if (generatedData.error) {
                    alert("AI Error: " + generatedData.error);
                    document.getElementById('aiBtn').classList.remove('hidden');
                    document.getElementById('loadingText').classList.add('hidden');
                    return;
                }
                
                let html = "";
                generatedData.forEach((q, i) => {
                    html += `
                    <div class="backdrop-blur-md bg-[#27272a]/80 border border-white/5 rounded-2xl p-6 shadow-xl transition-all hover:bg-[#27272a]">
                        <label class="text-xs font-bold text-gray-500 tracking-wider mb-2 block">QUESTION ${i+1}</label>
                        <input type="text" id="q${i}" value="${q.question}" class="w-full bg-transparent text-xl font-medium mb-6 text-white outline-none border-b border-gray-700 focus:border-blue-500 transition-colors pb-2">
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm mb-6">
                            <div class="flex items-center gap-3 bg-black/20 p-3 rounded-lg border border-white/5">
                                <span class="text-gray-500 font-bold">A</span>
                                <input type="text" id="q${i}_a" value="${q.option_a}" class="bg-transparent outline-none w-full text-gray-300">
                            </div>
                            <div class="flex items-center gap-3 bg-black/20 p-3 rounded-lg border border-white/5">
                                <span class="text-gray-500 font-bold">B</span>
                                <input type="text" id="q${i}_b" value="${q.option_b}" class="bg-transparent outline-none w-full text-gray-300">
                            </div>
                            <div class="flex items-center gap-3 bg-black/20 p-3 rounded-lg border border-white/5">
                                <span class="text-gray-500 font-bold">C</span>
                                <input type="text" id="q${i}_c" value="${q.option_c}" class="bg-transparent outline-none w-full text-gray-300">
                            </div>
                            <div class="flex items-center gap-3 bg-black/20 p-3 rounded-lg border border-white/5">
                                <span class="text-gray-500 font-bold">D</span>
                                <input type="text" id="q${i}_d" value="${q.option_d}" class="bg-transparent outline-none w-full text-gray-300">
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-4">
                            <label class="text-xs font-bold text-gray-500 tracking-wider">CORRECT</label>
                            <input type="text" id="q${i}_ans" value="${q.correct_option}" class="bg-black/30 border border-white/10 rounded text-center w-12 py-1 text-white uppercase font-bold outline-none focus:border-blue-500 transition-colors">
                        </div>
                    </div>`;
                });
                document.getElementById('editableQuizContainer').innerHTML = html;
                document.getElementById('loadingText').classList.add('hidden');
                document.getElementById('publishBtn').classList.remove('hidden');
                
            } catch (err) {
                alert("A network error occurred.");
                document.getElementById('aiBtn').classList.remove('hidden');
                document.getElementById('loadingText').classList.add('hidden');
            }
        }

        async function publishQuiz() {
            // Update data based on edits made by the teacher
            generatedData.forEach((q, i) => {
                q.question = document.getElementById(`q${i}`).value;
                q.option_a = document.getElementById(`q${i}_a`).value;
                q.option_b = document.getElementById(`q${i}_b`).value;
                q.option_c = document.getElementById(`q${i}_c`).value;
                q.option_d = document.getElementById(`q${i}_d`).value;
                q.correct_option = document.getElementById(`q${i}_ans`).value.toLowerCase();
            });

            // Send to our new real database instead of localStorage
            const res = await fetch('/api/save_quiz', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    title: "AI Generated Quiz", 
                    questions: generatedData 
                })
            });

            if(res.ok) {
                const data = await res.json();
                alert("Success! Quiz saved securely to database with ID: " + data.quiz_id);
            }
        }
    </script>
</body>
</html>
