<!DOCTYPE html>
<html lang="en">
<head>
    <title>Classlytics | Welcome</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            min-height: 100vh;
            overflow: hidden;
            background-color: #020617; 
            color: #ffffff;
            position: relative;
        }

        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px); 
            opacity: 0.4;
            transition: transform 0.3s ease-out;
            animation: float 20s infinite alternate ease-in-out;
        }

        .shape-1 {
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: #1d4ed8; 
            top: -15%;
            left: -10%;
            animation-duration: 25s;
        }

        .shape-2 {
            width: 40vw;
            height: 40vw;
            max-width: 500px;
            max-height: 500px;
            background: #0ea5e9; 
            bottom: -20%;
            right: -5%;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 35vw;
            height: 35vw;
            max-width: 400px;
            max-height: 400px;
            background: #312e81; 
            top: 30%;
            left: 30%;
            animation-duration: 28s;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .layout-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        .left-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        section {
            width: 100%;
            max-width: 420px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 3rem 3.5rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateX(-30px);
            animation: slideInForm 1s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.5s;
        }

        @keyframes slideInForm {
            to { transform: translateX(0); opacity: 1; }
        }

        h1 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .inputbox {
            position: relative;
            margin: 35px 0;
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .inputbox label {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.3s ease-in-out;
        }

        input:focus ~ label, input:valid ~ label, 
        select:focus ~ label, select:valid ~ label {
            top: -12px;
            font-size: 0.8rem;
            color: #3b82f6; 
        }

        .inputbox input, .inputbox select {
            width: 100%;
            height: 40px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #fff;
            padding-right: 30px;
        }
        
        .inputbox input:focus, .inputbox select:focus {
            border-bottom: 1px solid #3b82f6;
            margin-bottom: -1px;
        }

        .inputbox select option {
            color: #000;
        }

        .inputbox ion-icon {
            position: absolute;
            right: 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            top: 10px;
            transition: color 0.3s;
        }
        
        .inputbox input:focus ~ ion-icon, .inputbox select:focus ~ ion-icon {
            color: #3b82f6;
        }

        .forget {
            margin: -15px 0 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
        }

        .forget label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .forget label input {
            margin-right: 8px;
            accent-color: #3b82f6;
        }

        .forget a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forget a:hover {
            color: #fff;
        }

        button {
            width: 100%;
            height: 50px;
            border-radius: 25px;
            background-color: #fff;
            color: #0f172a;
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.2);
        }

        .register {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-top: 30px;
        }

        .register p a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            margin-left: 5px;
            transition: color 0.3s;
        }

        .register p a:hover {
            color: #3b82f6;
        }

        .cursive-svg {
            width: 90%;
            max-width: 600px;
            height: 160px;
        }

        .cursive-text {
            font-family: 'Dancing Script', cursive;
            font-size: 100px;
            fill: transparent;
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 2px;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawText 3.5s ease-in-out forwards, glowText 3s ease-in-out infinite alternate 3.5s;
        }

        .tagline {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6); 
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0; 
            transform: translateY(-10px);
            animation: fadeInText 1.5s ease forwards 2.5s;
        }

        @keyframes drawText {
            100% { stroke-dashoffset: 0; fill: rgba(255, 255, 255, 1); }
        }

        @keyframes glowText {
            0% { filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3)); }
            100% { filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.6)); }
        }

        @keyframes fadeInText {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 850px) {
            .layout-container {
                flex-direction: column;
            }
            .left-panel {
                flex: 1;
                align-items: flex-start;
                padding-top: 40px;
            }
            .right-panel {
                flex: 0.5;
                padding-top: 20px;
            }
            .cursive-text { font-size: 80px; }
            .cursive-svg { height: 120px; }
        }
        
        .flash-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1" data-speed="0.02"></div>
        <div class="shape shape-2" data-speed="-0.03"></div>
        <div class="shape shape-3" data-speed="0.015"></div>
    </div>

    <div class="layout-container">
        
        <div class="left-panel">
            <section>
                <form method="POST" action="">
                    
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for message in messages %}
                                <div class="flash-message">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <h1>Login</h1>
                    
                    <div class="inputbox">
                        <select name="role" required>
                            <option value="" disabled selected hidden></option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                        <label>I am a...</label>
                        <ion-icon name="people-outline"></ion-icon>
                    </div>

                    <div class="inputbox">
                        <input type="text" name="username" required>
                        <label>Username</label>
                        <ion-icon name="person-outline"></ion-icon>
                    </div>

                    <div class="inputbox">
                        <input type="password" name="password" required>
                        <label>Password</label>
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </div>

                    <div class="forget">
                        <label><input type="checkbox">Remember Me</label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit">Log in</button>

                    <div class="register">
                        <p>Don't have an account?<a href="#">Register</a></p>
                    </div>
                </form>
            </section>
        </div>

        <div class="right-panel">
            <svg viewBox="0 0 800 200" class="cursive-svg">
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="cursive-text">Classlytics</text>
            </svg>
            <p class="tagline">Privacy-First Classroom Analytics.</p>
        </div>

    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const shapes = document.querySelectorAll('.shape');
            shapes.forEach(shape => {
                const speed = shape.getAttribute('data-speed');
                const x = (window.innerWidth - e.pageX * 2) * speed;
                const y = (window.innerHeight - e.pageY * 2) * speed;
                shape.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>

</body>
</html>
