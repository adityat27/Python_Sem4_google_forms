<!DOCTYPE html>
<html lang="en">
<head>
    <title>Classlytics | Welcome</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* You can swap this URL with any cool background image you find online! */
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat;
            background-size: cover;
            background-position: center;
        }
        section {
            position: relative;
            max-width: 400px;
            width: 100%;
            background-color: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(25px); /* The Glassmorphism Effect */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 3rem;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 2rem;
            color: #fff;
            text-align: center;
        }
        .inputbox {
            position: relative;
            margin: 30px 0;
            width: 100%;
            border-bottom: 2px solid #fff;
        }
        .inputbox label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            color: #fff;
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.5s ease-in-out;
        }
        /* Floating label animation */
        input:focus ~ label, input:valid ~ label, 
        select:focus ~ label, select:valid ~ label {
            top: -5px;
        }
        .inputbox input, .inputbox select {
            width: 100%;
            height: 60px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            padding: 0 35px 0 5px;
            color: #fff;
        }
        /* Keeps the dropdown text readable on Windows */
        .inputbox select option {
            color: #000;
        }
        .inputbox ion-icon {
            position: absolute;
            right: 8px;
            color: #fff;
            font-size: 1.2rem;
            top: 20px;
        }
        .forget {
            margin: -15px 0 15px;
            font-size: 0.85rem;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }
        .forget label {
            display: flex;
            align-items: center;
        }
        .forget label input {
            margin-right: 3px;
        }
        .forget a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        .forget a:hover {
            text-decoration: underline;
        }
        button {
            width: 100%;
            height: 40px;
            border-radius: 40px;
            background-color: rgba(255, 255, 255, 1);
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.4s ease;
        }
        button:hover {
            background-color: rgba(255, 255, 255, 0.5);
            color: #fff;
        }
        .register {
            font-size: 0.9rem;
            color: #fff;
            text-align: center;
            margin: 25px 0 10px;
        }
        .register p a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
        }
        .register p a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: rgba(255, 50, 50, 0.5);
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <section>
        <form method="POST" action="/" style="width: 100%;">
            <h1>Login</h1>
            
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <div class="inputbox">
                <ion-icon name="people-outline"></ion-icon>
                <select name="role" required>
                    <option value="" disabled selected hidden></option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
                <label>I am a...</label>
            </div>

            <div class="inputbox">
                <ion-icon name="mail-outline"></ion-icon>
                <input type="text" name="username" required>
                <label>Username</label>
            </div>

            <div class="inputbox">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" name="password" required>
                <label>Password</label>
            </div>

            <div class="forget">
                <label><input type="checkbox">Remember Me</label>
                <a href="#">Forget Password</a>
            </div>

            <button type="submit">Log in</button>

            <div class="register">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>
        </form>
    </section>
</body>
</html>
