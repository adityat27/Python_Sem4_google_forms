<!DOCTYPE html>
<html lang="en">
<head>
    <title>Classlytics | Leaderboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-slate-50 p-8 max-w-4xl mx-auto text-slate-800">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-700">Class Leaderboard</h1>
        <a href="/dashboard" class="text-blue-600 hover:underline">← Back</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-100 border-b">
                <tr>
                    <th class="p-4">Rank</th>
                    <th class="p-4">Student</th>
                    <th class="p-4">Avg. Attention Score</th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b"><td class="p-4 font-bold text-yellow-500">#1</td><td class="p-4">Alice Johnson</td><td class="p-4 font-bold">98.5</td></tr>
                <tr class="border-b"><td class="p-4 font-bold text-slate-400">#2</td><td class="p-4">Rahul Sharma</td><td class="p-4 font-bold">94.0</td></tr>
                <tr><td class="p-4 font-bold text-orange-400">#3</td><td class="p-4">You</td><td class="p-4 font-bold text-blue-600">88.2</td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
